name: Build & Release Cloud Xtreme Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudXtremePro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "Cloud Xtreme Pro v1.0.0 (Release APK)"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
          body: |
            ### 🚀 Cloud Xtreme Pro - Official Android Release (v1.0.0)
            **Advanced Android Virtualization, App Cloning & Cloud Phone Platform**

            #### Highlights:
            - **Local Virtualization Engine**: Complete multi-instance container sandboxing. Independent files, SQLite databases, SharedPreferences, and login sessions.
            - **Cloud Phone Streaming**: Remote Android VM execution with real-time screen stream, interactive OS simulator, touch feedback, and adb shell.
            - **Google Play Services & MicroG Support**: Transparent GMS capability detection and open-source MicroG compatibility layer.
            - **APK Manager**: 1-click clone installed apps, import storage APKs, extract native ABIs.
            - **Material 3 Cyber-Dark UI**: High-tech responsive dashboard with hardware resource gauges.

            📥 **Direct Download Link**: Download `app-debug.apk` attached below and install it directly on your Android phone or emulator.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
